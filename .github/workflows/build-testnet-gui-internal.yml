name: Build Testnet GUI (Internal)

on:
  workflow_dispatch:
    inputs:
      relay_endpoint:
        description: "Relay URL baked into this testnet build"
        required: true
        type: string
        default: "http://188.166.160.233:8002"
      pool_endpoint:
        description: "Pool API URL baked into this testnet build"
        required: true
        type: string
        default: "http://188.166.160.233:8434"
      update_manifest_url:
        description: "Update manifest URL baked into this testnet build"
        required: true
        type: string
        default: "http://188.166.160.233:8002/version.json"
      test_invite_code:
        description: "Invite code used by test mode"
        required: true
        type: string
        default: "TESTTEST1"
      release_tag:
        description: "Public release tag to update"
        required: true
        type: string
        default: "internal-testnet-gui-latest"
      target_platform:
        description: "Choose which platform to build in this run"
        required: true
        type: choice
        default: all
        options:
          - all
          - windows-x64
          - linux-x64
          - macos-arm64

permissions:
  contents: write

concurrency:
  group: testnet-gui-internal-${{ github.ref }}-${{ inputs.release_tag }}-${{ inputs.target_platform }}
  cancel-in-progress: true

jobs:
  select-platform:
    name: Resolve target platform
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          case "${{ inputs.target_platform }}" in
            windows-x64)
              MATRIX='{"include":[{"os":"windows-latest","label":"Windows x64","platform":"windows-x64","package_ext":"zip"}]}'
              ;;
            linux-x64)
              MATRIX='{"include":[{"os":"ubuntu-latest","label":"Linux x64","platform":"linux-x64","package_ext":"tar.xz"}]}'
              ;;
            macos-arm64)
              MATRIX='{"include":[{"os":"macos-14","label":"macOS arm64","platform":"macos-arm64","package_ext":"tar.gz"}]}'
              ;;
            all)
              MATRIX='{"include":[{"os":"ubuntu-latest","label":"Linux x64","platform":"linux-x64","package_ext":"tar.xz"},{"os":"windows-latest","label":"Windows x64","platform":"windows-x64","package_ext":"zip"},{"os":"macos-14","label":"macOS arm64","platform":"macos-arm64","package_ext":"tar.gz"}]}'
              ;;
            *)
              echo "Unsupported target_platform: ${{ inputs.target_platform }}" >&2
              exit 1
              ;;
          esac
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: select-platform
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platform.outputs.matrix) }}

    env:
      RELAY_ENDPOINT: ${{ inputs.relay_endpoint }}
      POOL_ENDPOINT: ${{ inputs.pool_endpoint }}
      UPDATE_MANIFEST_URL: ${{ inputs.update_manifest_url }}
      TEST_INVITE_CODE: ${{ inputs.test_invite_code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Create Windows icon
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install imagemagick -y
          magick convert gui/images/main_icon.svg -define icon:auto-resize=256,128,64,48,32,16 app_icon.ico

      - name: Install OpenSSL via vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" >> $env:GITHUB_ENV

      - name: Create macOS icon
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ ! -f "app_icon.icns" ]; then
            ./create_icon.sh
          fi

      - name: Bake testnet endpoints into GUI defaults
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("gui/app_config.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (r'relay_endpoint: str = "[^"]*"', f"relay_endpoint: str = {json.dumps(os.environ['RELAY_ENDPOINT'])}"),
              (r'update_manifest_url: str = "[^"]*"', f"update_manifest_url: str = {json.dumps(os.environ['UPDATE_MANIFEST_URL'])}"),
              (r'pool_endpoint: str = "[^"]*"', f"pool_endpoint: str = {json.dumps(os.environ['POOL_ENDPOINT'])}"),
              (r"test_mode: bool = (True|False)", "test_mode: bool = True"),
              (r'test_invite_code: str = "[^"]*"', f"test_invite_code: str = {json.dumps(os.environ['TEST_INVITE_CODE'])}"),
          ]

          for pattern, replacement in replacements:
            updated, count = re.subn(pattern, replacement, text, count=1)
            if count != 1:
              raise SystemExit(f"Failed to patch app_config.py with pattern: {pattern}")
            text = updated

          path.write_text(text, encoding="utf-8")
          print("Patched gui/app_config.py with testnet defaults.")
          PY

      - name: Install dependencies (CPU-only torch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir pyinstaller

          python - <<'PY'
          from pathlib import Path

          src = Path("requirements.txt")
          dst = Path("requirements-no-torch.txt")
          lines = src.read_text(encoding="utf-8").splitlines()
          filtered = [ln for ln in lines if not ln.strip().lower().startswith("torch")]
          dst.write_text("\n".join(filtered) + "\n", encoding="utf-8")
          print(f"Wrote {dst} with {len(filtered)} requirements (torch removed).")
          PY

          python -m pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            torch torchvision

          python -m pip install --no-cache-dir -r requirements-no-torch.txt

      - name: Build app
        shell: bash
        env:
          BUILD_ARCH: ${{ startsWith(matrix.os, 'macos') && 'arm64' || '' }}
        run: |
          pyinstaller bitsota.spec

      - name: Compute package metadata
        id: meta
        shell: bash
        run: |
          BUILD_ID="${GITHUB_SHA::8}-$(date -u +%Y%m%d%H%M%S)"
          PACKAGE_NAME="BitSota-testnet-${{ matrix.platform }}-${BUILD_ID}.${{ matrix.package_ext }}"
          INFO_NAME="TESTNET_GUI_BUILD_INFO-${{ matrix.platform }}.json"

          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "info_name=${INFO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Linux launcher
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cat > dist/run-testnet-gui.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export BITSOTA_TEST_MODE=1
          export BITSOTA_AUTO_TASK_TYPE=pool_lease
          exec "${SCRIPT_DIR}/BitSota/BitSota" "$@"
          EOF
          chmod +x dist/run-testnet-gui.sh

      - name: Create macOS launcher
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          cat > dist/run-testnet-gui.command <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export BITSOTA_TEST_MODE=1
          export BITSOTA_AUTO_TASK_TYPE=pool_lease
          APP_BIN="${SCRIPT_DIR}/BitSota.app/Contents/MacOS/BitSota"
          if [ -x "${APP_BIN}" ]; then
            exec "${APP_BIN}" "$@"
          fi
          exec "${SCRIPT_DIR}/BitSota/BitSota" "$@"
          EOF
          chmod +x dist/run-testnet-gui.command

      - name: Create Windows launcher
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          set "BITSOTA_TEST_MODE=1"
          set "BITSOTA_AUTO_TASK_TYPE=pool_lease"
          "%~dp0BitSota\BitSota.exe" %*
          endlocal
          '@ | Out-File -FilePath dist\run-testnet-gui.bat -Encoding ascii

      - name: Write build info json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "built_at_utc": datetime.now(timezone.utc).isoformat(),
              "platform": "${{ matrix.platform }}",
              "relay_endpoint": os.environ["RELAY_ENDPOINT"],
              "pool_endpoint": os.environ["POOL_ENDPOINT"],
              "update_manifest_url": os.environ["UPDATE_MANIFEST_URL"],
              "test_mode": True,
              "test_invite_code": os.environ["TEST_INVITE_CODE"],
              "auto_task_type": "pool_lease",
          }
          Path("dist/${{ steps.meta.outputs.info_name }}").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Package Linux artifact
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          tar -cJf "dist/${{ steps.meta.outputs.package_name }}" -C dist BitSota run-testnet-gui.sh "${{ steps.meta.outputs.info_name }}"

      - name: Package macOS artifact
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ -d dist/BitSota.app ]; then
            tar -czf "dist/${{ steps.meta.outputs.package_name }}" -C dist BitSota.app run-testnet-gui.command "${{ steps.meta.outputs.info_name }}"
          else
            tar -czf "dist/${{ steps.meta.outputs.package_name }}" -C dist BitSota run-testnet-gui.command "${{ steps.meta.outputs.info_name }}"
          fi

      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\BitSota\*, dist\run-testnet-gui.bat, dist\${{ steps.meta.outputs.info_name }} -DestinationPath dist\${{ steps.meta.outputs.package_name }} -Force

      - name: Write SHA256 checksum
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          pkg = Path("dist/${{ steps.meta.outputs.package_name }}")
          checksum_path = Path(str(pkg) + ".sha256")
          h = hashlib.sha256()
          with pkg.open("rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                  h.update(chunk)
          checksum_path.write_text(f"{h.hexdigest()}  {pkg.name}\n", encoding="utf-8")
          PY

      - name: Validate asset size (<2GB)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pkg = Path("dist/${{ steps.meta.outputs.package_name }}")
          size = pkg.stat().st_size
          limit = 2 * 1024 * 1024 * 1024
          print(f"Package: {pkg.name}")
          print(f"Size bytes: {size}")
          if size >= limit:
              raise SystemExit(
                  f"Package exceeds GitHub release asset limit (2GB): {pkg.name} -> {size} bytes"
              )
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testnet-${{ matrix.platform }}
          path: |
            dist/${{ steps.meta.outputs.package_name }}
            dist/${{ steps.meta.outputs.package_name }}.sha256
            dist/${{ steps.meta.outputs.info_name }}

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: testnet-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: |
          ls -lh release-assets

      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Internal Testnet GUI (Latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release-assets/*

      - name: Post public links
        shell: bash
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ inputs.release_tag }}"
          {
            echo "## Internal Testnet GUI Build"
            echo ""
            echo "- Release page: ${RELEASE_URL}"
            echo "- Assets:"
            for f in release-assets/*; do
              name="$(basename "$f")"
              echo "  - https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.release_tag }}/${name}"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
