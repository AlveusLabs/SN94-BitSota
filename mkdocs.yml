site_name: BitSota Docs
site_description: BitSota and Base SOTA fork documentation for users, miners, validators, migration testers, and operators.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Getting Started: 快速开始
            Architecture: 架构
            Autoresearch: Autoresearch
            Base SOTA: Base SOTA
            Start Here: 从这里开始
            New Users: 新用户
            Bittensor Migrants: Bittensor 迁移
            One-Command Demo: 一条命令演示
            How Base SOTA Works: Base SOTA 工作原理
            Contracts: 合约
            Claims And Allocation: Claims 与分配
            Self-Validation: 自验证
            Support FAQ: 支持 FAQ
            Operator Readiness: 操作员就绪
            Deployment Manifest: 部署清单
            Project Log: 项目日志
            Architecture Overview: 架构概览
            Live Tasks: 当前任务
            Improve Submissions: 改进提交
            Problem Posting: 发布问题
            Problem Posting Requirements: 发布问题要求
            Future Roadmap: 未来路线图
            Components: 组件
            Overview: 概览
            Pool: 矿池
            Pool Claims: Pool Claims
            Miner: 矿工
            Validator: 验证者
            GUI: 图形界面
            Guides: 指南
            Current Local Checks: 当前本地检查
            Autoresearch Testnet E2E: Autoresearch 测试网端到端
            Public Validator Runner: 公共验证者运行指南
            Backend Routes: 后端路由
            Autoresearch Backend Routes: Autoresearch 后端路由
            Pool Backend Routes: Pool 后端路由
            Reference: 参考
            Mining: 挖矿
            Manual Mining: 手动挖矿
            Agent Mining: Agent 挖矿
            Validation: 验证
            Rewards: 奖励
            Backend Reward Snapshot: 后端奖励快照
            Claims And Rewards: Claims 与奖励
            Contributing: 贡献
            Docs Coverage: 文档覆盖率
            Archive: 归档
            AutoML-Zero Archive: AutoML-Zero 归档
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
        - .
      check_paths: false
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Autoresearch:
      - Architecture Overview: architecture.md
      - Live Tasks: current-competitions.md
      - Improve Submissions: miner-tips.md
      - Manual Mining: mining.md
      - Agent Mining: agent-mining.md
      - Problem Posting Requirements: problem-posting.md
      - Future Roadmap: roadmap.md
  - Base SOTA:
      - Start Here: base/index.md
      - New Users: base/new-users.md
      - Bittensor Migrants: base/bittensor-migrants.md
      - One-Command Demo: base/local-e2e.md
      - Base Sepolia Tester: base/base-sepolia-tester.md
      - How Base SOTA Works: base/architecture.md
      - Claims And Allocation: base/claims-and-allocation.md
      - Contracts: base/contracts.md
      - Self-Validation: base/self-validation.md
      - Support FAQ: base/support-faq.md
      - Operator Readiness: base/operations.md
      - Deployment Manifest: base/deployment-manifest.md
      - Project Log: base/project-log.md
  - Components:
      - Overview: components/index.md
      - Miner: components/miner.md
      - Validator: components/validator.md
      - Pool Claims: components/pool.md
      - GUI: components/gui.md
  - Guides:
      - Current Local Checks: local-testing.md
      - Autoresearch Testnet E2E: guides/autoresearch-testnet-e2e.md
      - Public Validator Runner: public-validator-runner.md
  - Backend Routes:
      - Autoresearch Backend Routes: autoresearch-backend-routes.md
      - Pool Backend Routes: pool-backend-routes.md
  - Validators:
      - Validation: validation.md
      - Public Validator Runner: public-validator-runner.md
  - Claims And Rewards:
      - Rewards: rewards.md
      - Backend Reward Snapshot: reward-modes.md
      - Claim Rewards: claim-rewards.md
      - Pool Claims: pool-mining.md
  - Archive:
      - AutoML-Zero Archive: archive/automl-zero/index.md
  - Disclaimer: disclaimer.md
  - Contributing: contributing.md
  - Docs Coverage: coverage.md
