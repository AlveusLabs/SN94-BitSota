site_name: BitSota Docs
site_description: BitSota subnet documentation for autoresearch miners, validators, problem owners, and operators.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Getting Started: 快速开始
            Architecture: 架构
            Autoresearch: Autoresearch
            Architecture Overview: 架构概览
            Current Competitions: 当前竞赛
            Miner Tips: 矿工提示
            Problem Posting: 发布问题
            Problem Posting Requirements: 发布问题要求
            Future Roadmap: 未来路线图
            Components: 组件
            Overview: 概览
            Pool: 矿池
            Pool Claims: Pool Claims
            Miner: 矿工
            Validator: 验证者
            GUI: 图形界面
            Guides: 指南
            Current Local Checks: 当前本地检查
            Autoresearch Testnet E2E: Autoresearch 测试网端到端
            Public Validator Runner: 公共验证者运行指南
            Backend Routes: 后端路由
            Autoresearch Backend Routes: Autoresearch 后端路由
            Pool Backend Routes: Pool 后端路由
            Reference: 参考
            Mining: 挖矿
            Mining Without an Agent: 手动挖矿
            Agent-Only Mining: Agent-only 挖矿
            Validation: 验证
            Rewards: 奖励
            Backend Reward Snapshot: 后端奖励快照
            Claims And Rewards: Claims 与奖励
            Contributing: 贡献
            Docs Coverage: 文档覆盖率
            Archive: 归档
            AutoML-Zero Archive: AutoML-Zero 归档
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
        - .
      check_paths: false
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Autoresearch:
      - Architecture Overview: architecture.md
      - Current Competitions: current-competitions.md
      - Miner Tips: miner-tips.md
      - Mining Without an Agent: mining.md
      - Agent-Only Mining: codex-only-mining.md
      - Problem Posting Requirements: problem-posting.md
      - Future Roadmap: roadmap.md
  - Components:
      - Overview: components/index.md
      - Miner: components/miner.md
      - Validator: components/validator.md
      - Pool Claims: components/pool.md
      - GUI: components/gui.md
  - Guides:
      - Current Local Checks: local-testing.md
      - Autoresearch Testnet E2E: guides/autoresearch-testnet-e2e.md
      - Public Validator Runner: public-validator-runner.md
  - Backend Routes:
      - Autoresearch Backend Routes: autoresearch-backend-routes.md
      - Pool Backend Routes: pool-backend-routes.md
  - Validators:
      - Validation: validation.md
      - Public Validator Runner: public-validator-runner.md
  - Claims And Rewards:
      - Rewards: rewards.md
      - Backend Reward Snapshot: reward-modes.md
      - Claim Rewards: claim-rewards.md
      - Pool Claims: pool-mining.md
  - Archive:
      - AutoML-Zero Archive: archive/automl-zero/index.md
  - Disclaimer: disclaimer.md
  - Contributing: contributing.md
  - Docs Coverage: coverage.md
