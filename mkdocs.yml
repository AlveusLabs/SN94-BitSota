site_name: BitSota Docs
site_description: BitSota subnet documentation for miners, validators, relay, pool, and local development.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
        - .
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Components:
      - Overview: components/index.md
      - Relay: components/relay.md
      - Pool: components/pool.md
      - Sidecar: components/sidecar.md
      - Miner: components/miner.md
      - Validator: components/validator.md
      - GUI: components/gui.md
  - Guides:
      - Local Testing: local-testing.md
      - Full Docker Loop: guides/full-docker-loop.md
      - Pool Functional Testing: guides/pool-functional-testing.md
  - Reference:
      - Configuration: configuration.md
      - Mining: mining.md
      - Pool Mining: pool-mining.md
      - Validation: validation.md
      - Rewards: rewards.md
      - Reward Modes: reward-modes.md
      - Capacitor: capacitor.md
      - Relay API: reference/relay-api.md
      - Pool API: reference/pool-api.md
  - Operations:
      - Monitoring: operations/monitoring.md
      - Deployment: operations/deployment.md
      - Troubleshooting: operations/troubleshooting.md
      - Security: operations/security.md
  - Contributing: contributing.md
  - Docs Coverage: coverage.md
